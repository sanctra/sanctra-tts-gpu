[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sanctra-tts-gpu"
version = "0.1.0"
description = "GPU TTS (YourTTS/VITS) with sync + streaming + enrollment"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.112.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.2",
  "websockets>=12.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.1",
  "scipy>=1.11.0",
  "TTS==0.22.0"
]

[tool.ruff]
line-length = 100
